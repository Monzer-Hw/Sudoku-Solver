[project]
name = "sudoku-solver"
version = "0.1.0"
description = "Computer vision Sudoku solver from images with real-time solutions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.1",
    "numpy>=1.26.4",
    "opencv-python-headless>=4.11.0.86,<5",
    "pydantic-settings>=2.10.1",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.31",
    "uvicorn[standard]>=0.35.0",
]
license = { file = "LICENSE" }

[dependency-groups]
dev = [
    "matplotlib>=3.10.0",
    "httpx>=0.28.1",
    "mypy>=1.14.0",
    "pre-commit>=4.0.0",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "unit: fast tests for a single module in isolation",
    "integration: tests wiring several modules or the API together",
    "e2e: full-stack tests over real example images (needs Tesseract)",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py312"
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI declares dependencies as argument defaults (Depends/File) by design.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["notebooks"]
