name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy src tests

  test:
    name: Tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit-integration
            markers: unit or integration
            min_coverage: 90
          - suite: e2e
            markers: e2e
            min_coverage: 0
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # Only the e2e suite shells out to a real tesseract binary: the unit tests
      # monkeypatch pytesseract.image_to_string and the integration tests use the
      # stub_ocr fixture. Installing it for the unit-integration leg cost 14-46s
      # per run and bought nothing. tesseract-ocr-eng is named explicitly because
      # it is only a *recommended* dependency of tesseract-ocr.
      - name: Install Tesseract OCR
        if: matrix.suite == 'e2e'
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: tesseract-ocr tesseract-ocr-eng
          version: 1

      - name: Install dependencies
        run: uv sync

      - name: Run ${{ matrix.suite }} tests
        run: >
          uv run pytest -m "${{ matrix.markers }}"
          --cov=src --cov-report=term-missing --cov-report=xml
          --cov-fail-under=${{ matrix.min_coverage }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.suite }}
          path: coverage.xml
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Install the wheel into a clean environment and import the app
        run: |
          uv venv /tmp/verify
          VIRTUAL_ENV=/tmp/verify uv pip install dist/*.whl
          VIRTUAL_ENV=/tmp/verify uv run --no-project python -c "import src.api.main as m; print(len(m.app.routes), 'routes')"

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sudoku-solver:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the container and wait for it to answer
        run: |
          docker run -d --name sudoku -p 8000:8000 sudoku-solver:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/base/ >/dev/null 2>&1; then
              echo "container is answering on /base/"
              exit 0
            fi
            sleep 2
          done
          echo "container never became reachable" >&2
          exit 1

      # The real check: a photo goes in and a solved grid comes out, which only
      # works if tesseract, its English traineddata and assets/mask.png all
      # resolved correctly inside the image.
      - name: Solve a real photo through the container
        run: |
          curl -fsS -F "file=@assets/examples/1.jpg" \
            http://127.0.0.1:8000/sudoku/solve -o response.json
          cat response.json
          python - <<'PY'
          import json

          data = json.load(open("response.json"))
          assert data["solved"] is True, data
          grid = data["grid"]
          assert len(grid) == 9, grid
          assert all(len(row) == 9 for row in grid), grid
          assert all(1 <= value <= 9 for row in grid for value in row), grid
          print("container returned a complete 9x9 solution")
          PY

      - name: Container logs on failure
        if: failure()
        run: docker logs sudoku

      - name: Remove the container
        if: always()
        run: docker rm -f sudoku
